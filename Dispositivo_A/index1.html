<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>RDT 4.0 - Interface Máquina A</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a1a;
            color: #ffffff;
            padding: 20px;
        }
        .painel {
            max-width: 800px;
            margin: 0 auto;
            background-color: #262626;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
        }
        h2 { color: #4a90e2; margin-top: 0; }
        .campo-envio {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        input[type="text"] {
            flex: 1;
            padding: 12px;
            border-radius: 4px;
            border: 1px solid #444;
            background-color: #333;
            color: #fff;
            font-size: 16px;
        }
        button {
            padding: 12px 24px;
            border: none;
            background-color: #4a90e2;
            color: white;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover { background-color: #357abd; }
        .terminal {
            background-color: #000000;
            font-family: 'Courier New', Courier, monospace;
            padding: 15px;
            height: 350px;
            overflow-y: auto;
            border-radius: 4px;
            border: 1px solid #444;
            font-size: 14px;
            line-height: 1.5;
        }
        .linha { margin-bottom: 4px; }
    </style>
</head>
<body>

    <div class="painel">
        <h2>RDT 4.0 - Envio e Recepção (Dispositivo A)</h2>
        
        <div class="campo-envio">
            <input type="text" id="mensagem" placeholder="Digite uma mensagem para transmitir via RDT 4.0..." onkeypress="verificarEnter(event)">
            <button onclick="enviar()">Enviar</button>
        </div>

        <h3>Histórico de Eventos / Logs:</h3>
        <div class="terminal" id="logs">
            <div class="linha" style="color: #888;">[Aguardando conexão com o Dispositivo A...]</div>
        </div>
    </div>

    <script>
        // Abre conexão com o WebSocket local criado no Java
        const ws = new WebSocket('ws://127.0.0.1:8080');

        ws.onopen = () => {
            const painelLogs = document.getElementById('logs');
            painelLogs.innerHTML = '<div class="linha" style="color: #5cb85c;">[Conectado com sucesso à Máquina A. Pronto para enviar!]</div>';
        };

        // Sempre que chegar um log novo do Java, adiciona na tela
        ws.onmessage = (event) => {
            const painelLogs = document.getElementById('logs');
            const novaLinha = document.createElement('div');
            novaLinha.className = 'linha';
            novaLinha.innerText = event.data;
            
            // Colorir as linhas baseado no tipo de log para facilitar a visualização
            if (event.data.includes('[TX]')) novaLinha.style.color = '#64b5f6'; // Transmissão (Azul)
            if (event.data.includes('[AK]')) novaLinha.style.color = '#81c784'; // ACK (Verde)
            if (event.data.includes('[TO]')) novaLinha.style.color = '#ffb74d'; // Timeout (Laranja)
            if (event.data.includes('[RT]')) novaLinha.style.color = '#ba68c8'; // Retransmissão (Roxo)
            if (event.data.includes('[CE]') || event.data.includes('[ER]')) novaLinha.style.color = '#ff5252'; // Erros (Vermelho)

            painelLogs.appendChild(novaLinha);
            painelLogs.scrollTop = painelLogs.scrollHeight; // Mantém o scroll no final
        };

        ws.onclose = () => {
            document.getElementById('logs').innerHTML += '<div class="linha" style="color: #ff5252;">[Conexão perdida com a Máquina A]</div>';
        };

        function enviar() {
            const campo = document.getElementById('mensagem');
            if (campo.value.trim() !== "") {
                ws.send(campo.value); // Manda o texto digitado puro para o Java
                campo.value = "";
            }
        }

        function verificarEnter(e) {
            if (e.key === 'Enter') enviar();
        }
    </script>
</body>
</html>
