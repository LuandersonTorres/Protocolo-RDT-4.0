<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>RDT 4.0 - Interface Máquina A</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a1a;
            color: #ffffff;
            padding: 20px;
        }
        .painel {
            max-width: 1000px;
            margin: 0 auto;
            background-color: #262626;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
        }
        h2 { color: #4a90e2; margin-top: 0; }
        .campo-envio {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        input[type="text"] {
            flex: 1;
            padding: 12px;
            border-radius: 4px;
            border: 1px solid #444;
            background-color: #333;
            color: #fff;
            font-size: 16px;
        }
        button {
            padding: 12px 24px;
            border: none;
            background-color: #4a90e2;
            color: white;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover { background-color: #357abd; }
        
        .titulos-paineis {
            display: flex;
            gap: 20px;
            margin-bottom: 5px;
        }
        .titulos-paineis h3 {
            flex: 1;
            margin: 0;
            font-size: 16px;
            color: #b3b3b3;
        }

        .container-telas {
            display: flex;
            gap: 20px;
            height: 380px;
        }

        /* Tela Esquerda: Histórico Técnico original (Fontes e tamanhos reduzidos) */
        .terminal {
            flex: 1;
            background-color: #000000;
            font-family: 'Courier New', Courier, monospace;
            padding: 15px;
            overflow-y: auto;
            border-radius: 4px;
            border: 1px solid #444;
            font-size: 11px; /* Fonte menor para maior escaneabilidade técnica */
            line-height: 1.4;
            box-sizing: border-box;
        }
        .linha { margin-bottom: 4px; }

        /* Tela Direita: Chat Customizado com a Paleta do Terminal */
        .chat-whatsapp {
            flex: 1;
            background-color: #000000; /* Fundo preto idêntico ao terminal técnico */
            padding: 15px;
            overflow-y: auto;
            border-radius: 4px;
            border: 1px solid #444;
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-sizing: border-box;
        }

        .wrapper-mensagem {
            display: flex;
            width: 100%;
        }
        .wrapper-mensagem.enviada { justify-content: flex-end; }
        .wrapper-mensagem.recebida { justify-content: flex-start; }

        .balao {
            max-width: 75%;
            padding: 8px 12px;
            border-radius: 7px;
            font-size: 13px;
            word-wrap: break-word;
            box-shadow: 0 1px 2px rgba(0,0,0,0.5);
            transition: all 0.3s ease;
            font-family: Arial, sans-serif;
        }

        /* [TX] - Mensagem em tráfego: Usa o tom de Azul Claro do log técnico */
        .balao.pendente {
            background-color: rgba(100, 181, 246, 0.15); 
            color: #64b5f6; /* Mesma cor do log [TX] */
            border: 1px dashed #64b5f6;
        }

        /* [AK] - Mensagem Confirmada: Transiciona para o tom de Verde do log técnico */
        .balao.confirmada {
            background-color: rgba(129, 199, 132, 0.2); 
            color: #81c784; /* Mesma cor do log [AK] */
            border: 1px solid #81c784;
        }

        /* Mensagens que venham a ser recebidas de B */
        .balao.recebida-cor {
            background-color: #222222;
            color: #e9edef;
            border: 1px solid #444;
        }
    </style>
</head>
<body>

    <div class="painel">
        <h2>RDT 4.0 - Envio e Recepção (Dispositivo A)</h2>
        
        <div class="campo-envio">
            <input type="text" id="mensagem" placeholder="Digite uma mensagem para transmitir via RDT 4.0..." onkeypress="verificarEnter(event)">
            <button onclick="enviar()">Enviar</button>
        </div>

        <div class="titulos-paineis">
            <h3>Histórico de Eventos / Logs:</h3>
            <h3>Visualização do Usuário:</h3>
        </div>

        <div class="container-telas">
            <div class="terminal" id="logs">
                <div class="linha" style="color: #888;">[Aguardando conexão com o Dispositivo A...]</div>
            </div>

            <div class="chat-whatsapp" id="chat">
                </div>
        </div>
    </div>

    <script>
        const ws = new WebSocket('ws://127.0.0.1:8080');

        ws.onopen = () => {
            const painelLogs = document.getElementById('logs');
            painelLogs.innerHTML = '<div class="linha" style="color: #5cb85c;">[Conectado com sucesso à Máquina A. Pronto para enviar!]</div>';
        };

        ws.onmessage = (event) => {
            const painelLogs = document.getElementById('logs');
            const novaLinha = document.createElement('div');
            novaLinha.className = 'linha';
            novaLinha.innerText = event.data;
            
            if (event.data.includes('[TX]')) novaLinha.style.color = '#64b5f6'; 
            if (event.data.includes('[AK]')) novaLinha.style.color = '#81c784'; 
            if (event.data.includes('[TO]')) novaLinha.style.color = '#ffb74d'; 
            if (event.data.includes('[RT]')) novaLinha.style.color = '#ba68c8'; 
            if (event.data.includes('[CE]') || event.data.includes('[ER]')) novaLinha.style.color = '#ff5252'; 

            painelLogs.appendChild(novaLinha);
            painelLogs.scrollTop = painelLogs.scrollHeight; 

            processarLogParaChat(event.data);
        };

        ws.onclose = () => {
            document.getElementById('logs').innerHTML += '<div class="linha" style="color: #ff5252;">[Conexão perdida com a Máquina A]</div>';
        };

        function enviar() {
            const campo = document.getElementById('mensagem');
            if (campo.value.trim() !== "") {
                criarBalaoNoChat(campo.value, 'enviada');
                ws.send(campo.value); 
                campo.value = "";
            }
        }

        function verificarEnter(e) {
            if (e.key === 'Enter') enviar();
        }

        function criarBalaoNoChat(texto, tipo) {
            const painelChat = document.getElementById('chat');
            const wrapper = document.createElement('div');
            wrapper.className = `wrapper-mensagem ${tipo}`;

            const balao = document.createElement('div');
            if (tipo === 'enviada') {
                balao.className = 'balao pendente';
                balao.setAttribute('data-conteudo', texto);
            } else {
                balao.className = 'balao recebida-cor';
            }
            balao.innerText = texto;

            wrapper.appendChild(balao);
            painelChat.appendChild(wrapper);
            painelChat.scrollTop = painelChat.scrollHeight;
        }

        function processarLogParaChat(logTexto) {
            if (logTexto.includes('[TX]')) {
                const matchData = logTexto.match(/DATA="(.+?)"/);
                if (matchData && matchData[1]) {
                    const textoFragmento = matchData[1];
                    const existe = document.querySelector(`[data-conteudo="${textoFragmento}"]`);
                    if (!existe) {
                        criarBalaoNoChat(textoFragmento, 'enviada');
                    }
                }
            }
            
            if (logTexto.includes('[AK]')) {
                const primeiroPendente = document.querySelector('.balao.pendente');
                if (primeiroPendente) {
                    primeiroPendente.classList.remove('pendente');
                    primeiroPendente.classList.add('confirmada');
                }
            }

            if (logTexto.includes('[RX]')) {
                const matchData = logTexto.match(/DATA="(.+?)"/);
                if (matchData && matchData[1]) {
                    criarBalaoNoChat(matchData[1], 'recebida');
                }
            }
        }
    </script>
</body>
</html>
